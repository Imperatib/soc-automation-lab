# splunk_correlation_rules.conf
# SOC Automation Lab — MITRE ATT&CK Mapped Detection Rules
# Author: [Your Name] | CySA+ | CompTIA PenTest+
# Format: Splunk savedsearches.conf (import via Settings > Searches, Reports & Alerts)
#
# Each rule maps to a MITRE ATT&CK technique and is tuned for
# enterprise environments with 500+ endpoints. Thresholds calibrated
# to reduce false positives while maintaining high-fidelity detections.

# ─────────────────────────────────────────────────────────────────────────────
# T1110 — Brute Force: Password Spraying / Credential Stuffing
# ─────────────────────────────────────────────────────────────────────────────
[DETECT_BruteForce_LoginSpike]
search = index=wineventlog EventCode=4625 \
    | bucket _time span=5m \
    | stats count AS failed_logins dc(src_ip) AS unique_sources dc(user) AS unique_users by _time, dest \
    | where failed_logins > 20 OR (unique_users > 10 AND unique_sources < 3) \
    | eval alert_type="Brute Force / Password Spray" \
    | eval mitre_technique="T1110" \
    | eval severity=if(failed_logins > 50, "CRITICAL", "HIGH")
cron_schedule = */5 * * * *
alert.severity = 3
alert.suppress = 1
alert.suppress.period = 10m
description = Detects rapid failed authentication — credential stuffing or password spray patterns. MITRE T1110.

# ─────────────────────────────────────────────────────────────────────────────
# T1059.001 — Command & Scripting: Suspicious PowerShell Execution
# ─────────────────────────────────────────────────────────────────────────────
[DETECT_SuspiciousPowerShell_Execution]
search = index=wineventlog EventCode=4104 \
    | eval ps_lower=lower(ScriptBlockText) \
    | where match(ps_lower, "iex|invoke-expression|downloadstring|encodedcommand|-enc |-nop |-windowstyle hidden|bypass|mimikatz|empire|amsiutils") \
    | stats count by host, user, ScriptBlockText \
    | where count >= 1 \
    | eval alert_type="Suspicious PowerShell" \
    | eval mitre_technique="T1059.001" \
    | eval severity="HIGH"
cron_schedule = */2 * * * *
alert.severity = 3
description = Detects encoded, obfuscated, or post-exploitation PowerShell patterns. MITRE T1059.001.

# ─────────────────────────────────────────────────────────────────────────────
# T1570 — Lateral Movement: PsExec / Remote Service Execution
# ─────────────────────────────────────────────────────────────────────────────
[DETECT_LateralMovement_PsExec]
search = index=wineventlog (EventCode=7045 OR EventCode=4697) \
    | eval svc_lower=lower(ServiceName) \
    | where match(svc_lower, "psexec|paexec|remcom|winexe") OR \
      (EventCode=7045 AND match(lower(ImagePath), "admin\$|ipc\$")) \
    | stats count by host, user, ServiceName, ImagePath \
    | eval alert_type="Lateral Movement via Remote Service" \
    | eval mitre_technique="T1570" \
    | eval severity="CRITICAL"
cron_schedule = */2 * * * *
alert.severity = 4
description = Detects PsExec-style lateral movement via remote service installation. MITRE T1570.

# ─────────────────────────────────────────────────────────────────────────────
# T1048.003 — Exfiltration: DNS Tunneling
# ─────────────────────────────────────────────────────────────────────────────
[DETECT_DataExfil_DNSTunneling]
search = index=dns \
    | eval query_len=len(query) \
    | stats count AS dns_queries avg(query_len) AS avg_qlen dc(query) AS unique_queries by src_ip, answer \
    | where dns_queries > 200 AND avg_qlen > 50 AND unique_queries > 150 \
    | eval alert_type="Suspected DNS Tunneling" \
    | eval mitre_technique="T1048.003" \
    | eval severity=if(dns_queries > 500, "CRITICAL", "HIGH")
cron_schedule = */10 * * * *
alert.severity = 3
description = Detects anomalously high DNS query volume with long query strings — indicative of DNS tunneling for C2 or data exfiltration. MITRE T1048.003.

# ─────────────────────────────────────────────────────────────────────────────
# T1053.005 — Persistence: Scheduled Task Creation
# ─────────────────────────────────────────────────────────────────────────────
[DETECT_Persistence_ScheduledTask]
search = index=wineventlog EventCode=4698 \
    | eval task_xml_lower=lower(TaskContent) \
    | where match(task_xml_lower, "powershell|cmd|wscript|mshta|rundll32|regsvr32|certutil") \
    | stats count by host, user, TaskName, TaskContent \
    | eval alert_type="Suspicious Scheduled Task" \
    | eval mitre_technique="T1053.005" \
    | eval severity="HIGH"
cron_schedule = */5 * * * *
alert.severity = 3
description = Detects scheduled task creation invoking LOLBins or scripting engines — common persistence mechanism. MITRE T1053.005.

# ─────────────────────────────────────────────────────────────────────────────
# T1070.001 — Defense Evasion: Indicator Removal — Log Clearing
# ─────────────────────────────────────────────────────────────────────────────
[DETECT_DefenseEvasion_LogClearing]
search = index=wineventlog (EventCode=1102 OR EventCode=104) \
    | stats count by host, user, _time \
    | eval alert_type="Windows Event Log Cleared" \
    | eval mitre_technique="T1070.001" \
    | eval severity="CRITICAL"
cron_schedule = */1 * * * *
alert.severity = 4
description = Detects Windows Security or System log clearing — strong indicator of post-compromise cleanup. MITRE T1070.001. Treat as CRITICAL until ruled out.

# ─────────────────────────────────────────────────────────────────────────────
# T1078 — Valid Accounts: Off-Hours Privileged Login
# ─────────────────────────────────────────────────────────────────────────────
[DETECT_OffHours_PrivilegedLogin]
search = index=wineventlog EventCode=4624 Logon_Type=10 \
    | eval hour=strftime(_time, "%H") \
    | where (hour < 6 OR hour > 22) \
    | lookup privileged_accounts.csv username AS user OUTPUT is_privileged \
    | where is_privileged="true" \
    | stats count by host, user, src_ip, hour \
    | eval alert_type="Off-Hours Privileged Remote Login" \
    | eval mitre_technique="T1078" \
    | eval severity="HIGH"
cron_schedule = */15 * * * *
alert.severity = 3
description = Detects privileged account remote logins outside business hours. MITRE T1078.
